version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: eslint
        versions: ['>=10.0.0']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      nextjs:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - eslint
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - jsdom
          - '@vitejs/plugin-react'
      types:
        patterns:
          - '@types/*'
      graphql:
        patterns:
          - graphql
          - graphql-yoga
          - '@graphql-*'
      visualization:
        patterns:
          - recharts
          - d3-geo
          - topojson-client
      styling:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
          - postcss
      e2e:
        patterns:
          - '@playwright/*'
      # Anything not claimed above: one PR for all minor/patch bumps, so
      # routine updates don't each open their own pull request.
      other-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
